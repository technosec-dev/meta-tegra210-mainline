# ---------------------------------------------------------------------------
# Tegra210 (Jetson Nano) mainline bring-up kernel config fragment.
#
# FIRST-PASS bring-up set: enough to boot from SD, get a serial console, USB,
# and (best effort) on-board gigabit ethernet. EXPECT TO ITERATE on this from
# the first boot log. Symbols mirror the essentials of upstream tegra_defconfig.
# ---------------------------------------------------------------------------

# --- SoC / platform ---
CONFIG_ARCH_TEGRA=y
CONFIG_ARCH_TEGRA_210_SOC=y
CONFIG_PINCTRL_TEGRA210=y
CONFIG_GPIO_TEGRA=y
CONFIG_TEGRA_BPMP=y
CONFIG_TEGRA210_ADMA=y
CONFIG_RESET_CONTROLLER=y
CONFIG_ARM_TEGRA_DEVFREQ=y

# --- Power: MAX77620 PMIC (required to bring up rails on the Nano) ---
CONFIG_MFD_MAX77620=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_MAX77620=y
CONFIG_REGULATOR_MAX8973=y
CONFIG_RTC_DRV_MAX77686=y
CONFIG_RTC_DRV_TEGRA=y

# --- Serial console (ttyS0) ---
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_TEGRA=y
CONFIG_SERIAL_TEGRA=y
CONFIG_SERIAL_TEGRA_TCU=y

# --- SD / eMMC ---
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_TEGRA=y

# --- USB (xHCI + Tegra PHY) ---
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_TEGRA=y
CONFIG_PHY_TEGRA_XUSB=y
CONFIG_USB_STORAGE=y

# --- Buses ---
CONFIG_I2C=y
CONFIG_I2C_TEGRA=y
CONFIG_SPI=y
CONFIG_SPI_TEGRA114=y
CONFIG_SPI_TEGRA210_QUAD=y

# --- Networking ---
# On-board GbE: Realtek RTL8211F PHY. VERIFY on first boot; if the on-board port
# does not come up, a USB-ethernet dongle works out of the box with the modules
# below. Tegra210 has no EQOS MAC, so on-board NIC support depends on the DT/PHY
# path in your chosen kernel — this is the single most likely thing to iterate.
CONFIG_NETDEVICES=y
CONFIG_PHYLIB=y
CONFIG_REALTEK_PHY=y
CONFIG_MICREL_PHY=y
# common USB-ethernet fallbacks
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_NET_AX88179_178A=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_RTL8152=y

# --- Filesystems ---
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# --- Misc useful ---
CONFIG_WATCHDOG=y
CONFIG_TEGRA_WATCHDOG=y
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_TEGRA=y

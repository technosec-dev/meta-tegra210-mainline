#@TYPE: Machine
#@NAME: Jetson Nano (mainline, headless)
#@DESCRIPTION: NVIDIA Jetson Nano Developer Kit (Tegra210 / Tegra X1) running an
# upstream mainline kernel and open-source userspace. NO L4T, NO CUDA, NO GPU
# acceleration, NO hardware video codecs. Console/networking appliance only.
#
# Boot chain: BootROM -> NVIDIA early firmware (mb1/BPMP/TOS) -> U-Boot -> extlinux -> kernel
# The NVIDIA early firmware + U-Boot are flashed ONCE to the board's SPI/boot
# partitions host-side (see README). This build produces the SD-card rootfs +
# mainline kernel + DTB + extlinux.conf that U-Boot then boots.

require conf/machine/include/arm/armv8a/tune-cortexa57.inc

MACHINEOVERRIDES =. "tegra210:"

MACHINE_FEATURES = "usbhost usbgadget ext2 vfat"

# ---- Kernel ----------------------------------------------------------------
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.12%"
KERNEL_IMAGETYPE = "Image"
# Upstream arm64 DTBs live under the nvidia/ subdirectory
KERNEL_DEVICETREE = "nvidia/tegra210-p3450-0000.dtb"

# ---- Bootloader ------------------------------------------------------------
# U-Boot is optional to (re)build: the board's existing U-Boot (from a prior
# L4T/kirkstone flash) already does extlinux distro-boot and will happily boot
# this mainline kernel. Building it here lets you flash a matched mainline U-Boot.
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
UBOOT_MACHINE ?= "p3450-0000_defconfig"
EXTRA_IMAGEDEPENDS += "u-boot"

# extlinux.conf generated on the rootfs /boot (U-Boot distro boot reads it)
UBOOT_EXTLINUX = "1"
UBOOT_EXTLINUX_CONSOLE = "console=ttyS0,115200"
UBOOT_EXTLINUX_ROOT = "root=/dev/mmcblk0p1 rw rootwait"
UBOOT_EXTLINUX_FDT = "../${@d.getVar('KERNEL_DEVICETREE').split('/')[-1]}"

SERIAL_CONSOLES = "115200;ttyS0"

# ---- Image / SD card -------------------------------------------------------
IMAGE_FSTYPES += "wic wic.bmap tar.gz"
WKS_FILE ?= "jetson-nano-sdimage.wks"
IMAGE_BOOT_FILES ?= "Image ${@d.getVar('KERNEL_DEVICETREE').split('/')[-1]}"
IMAGE_INSTALL:append = " kernel-image kernel-devicetree"

# ---- Explicitly NO proprietary GPU / CUDA / multimedia ---------------------
# (nothing added; kept as a marker of intent)
